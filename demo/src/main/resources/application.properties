spring.application.name=demo
server.port=8081

# Security & JWT Configuration
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.access-token-expiration-ms=900000
application.security.jwt.refresh-token-expiration-ms=604800000
application.security.jwt.issuer=teca-ecommerce

# Datasource & JPA configuration (Default: H2 in-memory for instant plug & play)
# To use PostgreSQL, run with: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:tecadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.session.store-type=none
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
